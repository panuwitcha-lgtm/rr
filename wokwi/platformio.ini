; Health Chair ตัวจำลอง Wokwi (ใช้กับ VS Code + PlatformIO + Wokwi Simulator)
; เปิดโฟลเดอร์ wokwi/ นี้ใน VS Code -> PlatformIO Build -> F1 "Wokwi: Start Simulator"

[env:wokwi]
platform = espressif32 @ ^6.9.0   ; Arduino core 2.0.x (เหมือนเฟิร์มแวร์จริง)
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
; ไม่เปิด USB CDC: ใน Wokwi ข้อความออกทาง UART0 (esp:TX ต่อกับ Terminal ใน diagram.json)

lib_deps =
  knolleary/PubSubClient @ ^2.8
  bblanchon/ArduinoJson @ ^7.0.0
  rfetick/MPU6050_light @ ^1.1.0
