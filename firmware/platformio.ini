; Health Chair firmware (ESP32-S3-WROOM-1-N16R8 บนบอร์ด kk)
; เปิดโฟลเดอร์นี้ด้วย VS Code + PlatformIO แล้วกด Build / Upload

[env:health-chair]
platform = espressif32 @ ^6.9.0   ; Arduino core 2.0.x (ทดสอบกับรุ่นนี้)
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; โมดูล N16R8: แฟลช 16MB, PSRAM 8MB แบบ OPI
board_build.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB

build_flags =
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1

lib_deps =
  knolleary/PubSubClient @ ^2.8
  bblanchon/ArduinoJson @ ^7.0.0
  rfetick/MPU6050_light @ ^1.1.0
